# Config for the kanban tmux server (tmux -L tonka). The user's ~/.tmux.conf is
# loaded in the middle so it can override defaults but not the board's bindings.
set -g default-terminal "screen-256color"
set -sg escape-time 10
set -g history-limit 50000

source-file -q ~/.tmux.conf

# The board finds windows by name, so names must not change under it.
set -g allow-rename off
setw -g automatic-rename off

bind -n 'C-\' select-window -t 'kanban:=board'
set -g status-left "[tonka] "
set -g status-left-length 20
# The board sets @tonka-waiting to the number of cards that need input.
set -g status-right "#{?#{@tonka-waiting},#[reverse] #{@tonka-waiting} need input #[noreverse] ,}C-\\ board "
set -g status-right-length 60
